# Временный конфиг — показывает заглушку всем
# Когда починишь — смотри комментарий внизу

server {
    listen 80;
    listen [::]:80;
    server_name chesshome.pro www.chesshome.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chesshome.pro www.chesshome.pro;

    ssl_certificate     /etc/letsencrypt/live/chesshome.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chesshome.pro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/chesshome-maintenance;

    # Все запросы → заглушка
    location / {
        try_files /maintenance.html =503;
    }
}

